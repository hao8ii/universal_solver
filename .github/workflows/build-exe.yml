name: 打包exe

# 推送到 main 自动打包；打 v* 标签自动发布 Release；也可在 Actions 页面手动触发
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'

# 同一分支只保留最新一次构建，省时间
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows打包
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      # 云端控制台默认 cp1252，强制 UTF-8 让中文日志正常显示
      PYTHONUTF8: '1'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka

      - name: 运行题库解析测试
        run: python -m unittest tests.test_bank -v

      # Nuitka 的编译缓存（clcache/下载缓存），第二次构建明显变快
      - name: 恢复Nuitka编译缓存
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/Nuitka
          key: nuitka-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-${{ github.run_id }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-
            nuitka-${{ runner.os }}-

      # bianyi.py 默认 onefile 模式；MSVC 编译输出固定在纯英文路径
      # （%LOCALAPPDATA%\ua_build），完成后自动拷回 build\ 目录
      - name: 打包exe
        run: python bianyi.py --yes

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: UniversalAnswerTool-${{ github.ref_name }}
          path: build/通用答题工具.exe
          if-no-files-found: error

      - name: 发布Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/通用答题工具.exe
